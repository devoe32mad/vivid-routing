name: Sponsorship Performance Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sponsorship-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run sponsorship performance tests
        run: node --test test/sponsorship-performance-plan.test.js
